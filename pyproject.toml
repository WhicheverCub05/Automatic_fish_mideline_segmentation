[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-midline-segmentation"
version = "1.0.0"
description = "Automatic fish midline segmentation: joint generation methods, error metrics, CLI, web viewer and LBM fluid simulation."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.5",
    "flask>=2.0",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.9"]

[project.scripts]
fishseg-cli = "main:main"
fishseg-web = "web_viewer:main"
fishseg-sim = "midline_fluid_sim:main"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# bug-catching gate for CI: syntax/runtime errors (E9) + pyflakes (F)
select = ["E9", "F"]

[tool.setuptools]
py-modules = [
    "core",
    "calculate_error",
    "generation_methods",
    "generation_methods_area_error",
    "generation_methods_linear_error",
    "method_registry",
    "main",
    "gather_data",
    "web_viewer",
    "midline_fluid_sim",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
