<!DOCTYPE html>
<!-- Step-through page served by web_viewer.py at /steps: runs several growth
     methods with step recording and shows their joint configurations side by
     side, replayed one step at a time (Forward / Skip 5 buttons). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Growth Methods Step-Through - Fish Midline Segmentation Viewer</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem("fishseg-theme");
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  })();
</script>
<style>
  :root {
    --bg:#f6f8fa; --panel:#fff; --border:#d7dde3; --text:#222; --muted:#667;
    --blue:#1f77b4; --red:#d62728; --green:#2ca02c; --orange:#ff7f0e;
    --input:#fff; --chip:#f0f3f6; --hover:#eef2f5;
  }
  :root[data-theme="dark"] {
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --blue:#388bfd; --red:#f85149; --green:#3fb950; --orange:#d29922;
    --input:#21262d; --chip:#21262d; --hover:#21262d;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--panel); border-bottom:1px solid var(--border); padding:10px 14px; }
  h1 { font-size:16px; margin:0 0 8px; }
  h1 a { font-size:12px; font-weight:400; color:var(--blue); text-decoration:none; margin-left:10px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:6px; }
  .row label { color:var(--muted); font-size:12px; }
  input,select,button { font:inherit; padding:4px 8px; border:1px solid var(--border); border-radius:4px; background:var(--input); color:var(--text); }
  input[type=text] { width:300px; }
  input[type=range] { width:130px; vertical-align:middle; }
  button { cursor:pointer; }
  button:hover { background:var(--hover); }
  button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  button.primary:hover { background:#1a659c; }
  #status { padding:4px 14px; font-size:12px; color:var(--muted); }
  #methodList { display:flex; flex-wrap:wrap; gap:6px; }
  .mChip { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:2px 8px;
           border:1px solid var(--border); border-radius:10px; background:var(--chip); cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; padding:12px 14px; }
  .chartCard { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px; }
  .chartTitle { font-size:12px; margin:0 0 6px; color:var(--text); font-weight:600; }
  .chartCv { width:100%; height:220px; display:block; border:1px solid var(--border); border-radius:4px; }
  .chartFoot { font-size:11px; color:var(--muted); margin-top:4px; }
  .chartErr { color:var(--red); }
</style>
</head>
<body>
<header>
  <h1>Growth methods step-through <a href="/">back to viewer</a><button id="themeToggle" title="toggle dark / light mode" style="float:right;">Dark</button></h1>
  <div class="row">
    <label>folder <input type="text" id="folder" title="folder containing the .xls / .csv tracking data"></label>
    <button id="btnFolder" title="load the file list for the folder path above">Load</button>
    <select id="file" title="data file to run the step comparison on"></select>
    <button id="run" class="primary" title="run the selected methods with step recording">Run</button>
  </div>
  <div class="row">
    <label>threshold <input type="range" id="threshold" min="0.05" max="20" step="0.05" value="0.5"
      title="error threshold (cm) for the error-based growth methods"> <span id="thresholdVal">0.5</span></label>
    <label>segments <input type="range" id="segments" min="2" max="40" step="1" value="10"
      title="segment count for the count-based methods"> <span id="segmentsVal">10</span></label>
    <label>frame <input type="range" id="frame" min="0" max="0" value="0"
      title="frame / time step shown on the charts"> <span id="frameVal">0</span></label>
  </div>
  <div class="row">
    <span style="font-size:12px;color:var(--muted)">methods:</span>
    <span id="methodList"></span>
  </div>
  <div class="row">
    <button id="back5" title="go back 5 steps">&lt;| Back 5</button>
    <button id="back" title="one step back">&lt; Back</button>
    <button id="forward" class="primary" title="one step forward">Forward &gt;</button>
    <button id="skip5" class="primary" title="skip forward 5 steps">Skip 5 &gt;&gt;</button>
    <input type="range" id="step" min="0" max="0" value="0" style="width:220px"
      title="scrub through the recorded joint-placement steps">
    <span id="stepVal">step 0 / 0</span>
  </div>
</header>
<div id="status"></div>
<main>
  <div id="grid" class="grid"></div>
</main>
<script type="module" src="/js/steps.js"></script>
</body>
</html>
